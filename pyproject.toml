[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "invoice-cn-ce"
version = "1.0.0"
description = "中国财务票据解析服务（开源版 CE）：PDF / XML / OFD 全电发票，7 类票种字段级解析，纯 Python 无 JVM 依赖，支持批量与 HTTP API。"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  { name = "invoice-cn-ce" },
]
keywords = [
  "invoice", "e-invoice", "invoice-cn", "fapiao", "发票", "增值税发票", "全电发票", "数电票",
  "accounting", "finance", "erp", "财务", "会计", "代账", "tax", "vat-invoice",
  "pdf", "xml", "ofd", "pdfplumber", "fastapi",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Chinese (Simplified)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "pdfplumber>=0.11.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
invoice_cn_ce        = "invoice_cn_ce.cli:main"
invoice_cn_ce-server = "invoice_cn_ce.server:main"

[project.urls]
Homepage = "https://github.com/giwu-lab/invoice_cn_ce"
Repository = "https://github.com/giwu-lab/invoice_cn_ce"
Issues = "https://github.com/giwu-lab/invoice_cn_ce/issues"
Changelog = "https://github.com/giwu-lab/invoice_cn_ce/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_cn_ce"]

[tool.hatch.build.targets.sdist]
include = [
    "src/invoice_cn_ce/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "docs/**",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
# Starlette currently deprecates the use of ``httpx`` with
# ``starlette.testclient`` and recommends ``httpx2`` instead — but
# ``httpx2`` is not yet published on PyPI, so we cannot act on the
# suggestion yet.  Silence just this specific warning so it does not
# pollute every pytest run; the rule will be removed once ``httpx2``
# becomes installable.
#
# ``StarletteDeprecationWarning`` lives in ``starlette.exceptions`` and
# is not exposed as a builtin name, so we filter on its parent class
# ``UserWarning`` with a tight message regex to keep the scope narrow.
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:UserWarning",
    # H32: anyio 4.x deprecation emitted by TestClient at import time.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["dist", "build", "wheels"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# 报关单样本的票面原文（含中文表头）按原样保留在测试里 —— 折行会破坏
# 解析器依赖的版面结构，所以这一段的 E501 是数据本身的长度，不是代码风格。
"tests/test_parsers.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["build/", "dist/"]